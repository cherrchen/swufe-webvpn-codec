[project]
name = "swufe-webvpn-bridge"
version = "0.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mitmproxy>=12.2,<13", "cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swufe_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
