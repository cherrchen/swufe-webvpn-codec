<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>SWUFE WebVPN Bridge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>SWUFE WebVPN Bridge</h1>
      <p id="status-bar" role="status" aria-live="polite" data-tone="muted">
        <span id="status-text">未登录</span>
        <span id="status-reason"></span>
      </p>
    </header>

    <main>
      <section aria-labelledby="primary-actions-title">
        <h2 id="primary-actions-title" class="visually-hidden">主操作</h2>
        <button id="login-button" type="button">登录 WebVPN</button>
        <label class="switch">
          <input id="bridge-toggle" type="checkbox" role="switch" />
          <span>开启桥接</span>
        </label>
      </section>

      <section aria-labelledby="allowlist-title">
        <h2 id="allowlist-title">Allowlist</h2>
        <p id="allowlist-hosts">读取中…</p>
        <p class="hint">allowlist 保存在 <code>config.json</code>，本版本不提供增删界面。</p>
      </section>

      <section aria-labelledby="certificate-title">
        <h2 id="certificate-title">证书</h2>
        <div class="button-row">
          <button id="install-ca" type="button">安装本机 CA</button>
          <button id="uninstall-ca" type="button">卸载本机 CA</button>
        </div>
        <p id="ca-state">读取中…</p>
      </section>

      <section aria-labelledby="advanced-title">
        <h2 id="advanced-title">高级</h2>
        <p id="proxy-state">读取中…</p>
        <label class="checkbox">
          <input id="debug-logging" type="checkbox" />
          <span>调试日志</span>
        </label>
        <p class="hint">调试日志只记录域名与改写结果，不含正文与 Cookie。</p>
      </section>

      <p id="message" role="status" aria-live="polite"></p>
    </main>

    <dialog id="ca-warning-modal" aria-labelledby="ca-warning-title">
      <h2 id="ca-warning-title">安装本机 CA</h2>
      <p>本证书用于在本机解密并改写 HTTPS，仅限个人设备；可随时卸载。</p>
      <form method="dialog">
        <button value="confirm" type="submit">确认安装</button>
        <button value="cancel" type="submit">取消</button>
      </form>
    </dialog>

    <dialog id="proxy-conflict-modal" aria-labelledby="proxy-conflict-title">
      <h2 id="proxy-conflict-title">系统代理已占用</h2>
      <p>检测到系统代理已启用。请先关闭 Clash / mihomo / 其它 VPN 的系统代理后再试。</p>
      <form method="dialog">
        <button type="submit">知道了</button>
      </form>
    </dialog>

    <dialog id="session-expired-modal" aria-labelledby="session-expired-title">
      <h2 id="session-expired-title">会话已过期</h2>
      <p>WebVPN 会话已失效。桥接已停止并已清除系统代理。</p>
      <form method="dialog">
        <button id="go-login" value="login" type="submit">去登录</button>
      </form>
    </dialog>

    <script type="module" src="../dist/renderer/renderer.js"></script>
  </body>
</html>
