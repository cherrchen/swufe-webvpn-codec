name: Feature request
description: 提出功能想法。Issue 仅用于跟踪与讨论，批准后的功能必须进入 specs/。
title: '[Feature] '
labels: ['feature']
body:
  - type: markdown
    attributes:
      value: |
        > **重要**：本 Issue **不替代** Feature Spec。
        > Issue 只用于跟踪与讨论；经批准的功能必须按
        > [specs/README.md](../blob/main/specs/README.md) 建立在 `specs/<id>-<feature-name>/`。

        不要在本 Issue 中假定技术方案、数据结构或接口；未知内容写 `TBD`。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么问题？现状与痛点。
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 期望结果
      description: 达成什么目标、如何判断达成（可验证的判据）。
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: 明确不包含
      description: 本需求明确不做的部分，用于避免范围蔓延。未知写 TBD。
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: 关联
      description: 关联的需求 ID（REQ/NFR）、Spec、ADR、外部资料链接。
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: 待确认问题
      description: 目前无法确定的信息。**不要用猜测填补。**
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已检查 [goals-and-non-goals.md](../blob/main/docs/overview/goals-and-non-goals.md)，确认该需求不属于明确的非目标
          required: true
        - label: 已检查现有 `specs/`，确认没有重复的 Feature
          required: true
        - label: 理解本 Issue 通过后仍需创建正式 Spec 才能进入实现
          required: true
