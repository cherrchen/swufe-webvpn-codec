name: python-tests

# Python L0 regression gate only (codec vectors, allowlist matching, config
# parsing/validation). L1/L2 are run locally — see
# docs/development/testing-strategy.md.
# This workflow does not build, deploy, release or publish anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l0:
    name: L0 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: bridges/python/uv.lock

      - name: Install dependencies
        working-directory: bridges/python
        run: uv sync --frozen

      - name: Run L0 tests
        working-directory: bridges/python
        run: uv run pytest tests/l0 -q
