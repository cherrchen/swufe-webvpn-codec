name: app-tests

# Electron app (M2): type check all three tsconfigs and run the Electron-free unit
# suite; M6 adds the renderer component suite (vitest + jsdom). Neither suite
# imports `electron` or needs a display, so no binary download is needed here;
# L3/real-machine checks stay manual
# (see docs/development/testing-strategy.md).
# This workflow does not build installers, deploy, release or publish anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, unit and UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter swufe-webvpn-bridge run typecheck

      - name: Unit tests
        run: pnpm --filter swufe-webvpn-bridge run test:unit

      # Renderer component tests (vitest + jsdom, M6): observable UI behaviour of
      # the four windows. No Electron binary and no display required either.
      - name: UI component tests
        run: pnpm --filter swufe-webvpn-bridge run test:ui
